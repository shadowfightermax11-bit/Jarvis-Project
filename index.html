<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    font-family: Consolas, "Courier New", monospace;
    color: #d8faff;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 45%, #18204d 0%, transparent 25%),
        radial-gradient(circle at 20% 80%, #160d35 0%, transparent 25%),
        radial-gradient(circle at 80% 20%, #32110d 0%, transparent 20%);
    pointer-events: none;
}

/* LOGIN */

.login {
    position: relative;
    width: min(90%, 430px);
    padding: 35px 25px;
    border: 1px solid #5de7ff;
    background: rgba(2, 6, 15, .88);
    box-shadow:
        0 0 20px #00eaff55,
        inset 0 0 30px #00eaff0d;
    text-align: center;
}

.login h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 8px;
    color: #fff;
    text-shadow:
        0 0 8px #00eaff,
        0 0 25px #00eaff;
}

.subtitle {
    margin: 12px 0 30px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #7beeff;
}

input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #247c91;
    outline: none;
    background: #030b13;
    color: #8df5ff;
    font-family: inherit;
    font-size: 14px;
}

input:focus {
    border-color: #00eaff;
    box-shadow: 0 0 12px #00eaff44;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border: 1px solid #00eaff;
    background: transparent;
    color: #00eaff;
    font-family: inherit;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #00eaff;
    color: #02030a;
    box-shadow: 0 0 25px #00eaff;
}

.error {
    height: 18px;
    margin-top: 12px;
    font-size: 11px;
    color: #ff3948;
}

/* DASHBOARD */

.dashboard {
    display: none;
    position: relative;
    width: 100%;
    height: 100%;
}

/* TOP BAR */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 65px;
    padding: 0 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #143744;
    background: rgba(2, 5, 12, .8);
}

.logo {
    color: #fff;
    letter-spacing: 5px;
    text-shadow: 0 0 12px #00eaff;
}

.online {
    font-size: 11px;
    color: #65ff9b;
    text-shadow: 0 0 10px #65ff9b;
}

.online::before {
    content: "● ";
}

/* CENTER */

.core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.orb {
    position: relative;
    width: 145px;
    height: 145px;
    margin: auto;
    border-radius: 50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #fff700 8%,
            #aaff00 22%,
            #682cff 48%,
            #16114b 70%,
            transparent 72%
        );

    box-shadow:
        0 0 15px #fff700,
        0 0 35px #aaff00,
        0 0 65px #673cff,
        0 0 110px #4920ff;

    animation: orbPulse 2.2s infinite ease-in-out;
}

.orb::before {
    content: "";
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    border: 1px solid #b7ff00aa;
    box-shadow:
        0 0 15px #b7ff00,
        0 0 30px #672cff;
    animation: spin 7s linear infinite;
}

.orb::after {
    content: "";
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    border: 1px solid #ff304888;
    border-left-color: transparent;
    border-bottom-color: transparent;
    animation: spinReverse 5s linear infinite;
}

@keyframes orbPulse {
    0%, 100% {
        transform: scale(.94);
        filter: brightness(.9);
    }

    50% {
        transform: scale(1.05);
        filter: brightness(1.3);
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes spinReverse {
    to {
        transform: rotate(-360deg);
    }
}

.status {
    margin-top: 55px;
    font-size: 13px;
    letter-spacing: 4px;
    color: #78f5ff;
    text-shadow: 0 0 12px #00eaff;
}

.status.listening {
    color: #fff700;
    text-shadow: 0 0 15px #fff700;
    animation: listening 1s infinite;
}

@keyframes listening {
    50% {
        opacity: .35;
    }
}

.hint {
    margin-top: 14px;
    font-size: 10px;
    color: #718b96;
    letter-spacing: 2px;
}

/* BOTTOM */

.bottom {
    position: absolute;
    bottom: 25px;
    left: 25px;
    right: 25px;
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #4c6974;
}

@media(max-width:500px) {
    .orb {
        width: 115px;
        height: 115px;
    }

    .logo {
        font-size: 13px;
    }

    .status {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login" id="login">

    <h1>J.A.R.V.I.S.</h1>

    <div class="subtitle">
        PERSONAL AI ASSISTANT SYSTEM<br>
        SECURE INITIALIZATION
    </div>

    <input
        id="name"
        type="text"
        placeholder="ENTER YOUR NAME"
        autocomplete="off"
    >

    <input
        id="phone"
        type="tel"
        placeholder="ENTER PHONE NUMBER"
        autocomplete="off"
    >

    <input
        id="password"
        type="password"
        placeholder="ENTER ACCESS PASSWORD"
        autocomplete="off"
    >

    <button onclick="login()">
        INITIALIZE SYSTEM
    </button>

    <div class="error" id="error"></div>

</div>


<!-- ================= DASHBOARD ================= -->

<div class="dashboard" id="dashboard">

    <div class="topbar">

        <div class="logo">
            J.A.R.V.I.S.
        </div>

        <div class="online">
            SYSTEM ONLINE
        </div>

    </div>


    <div class="core">

        <div class="orb" id="orb"></div>

        <div class="status" id="status">
            ACTIVATED
        </div>

        <div class="hint">
            SAY &nbsp; "HEY JARVIS"
        </div>

    </div>


    <div class="bottom">

        <span>
            EDITH CORE // CONNECTED
        </span>

        <span>
            AI // READY
        </span>

    </div>

</div>


<script>

const PASSWORD = "jarvisxedith@07";


function login() {

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    if (!name) {

        error.innerText =
            "IDENTITY REQUIRED";

        return;
    }


    if (!phone) {

        error.innerText =
            "PHONE NUMBER REQUIRED";

        return;
    }


    if (password !== PASSWORD) {

        error.innerText =
            "ACCESS DENIED — INVALID PASSWORD";

        return;
    }


    error.innerText = "";


    const loginBox =
        document.getElementById("login");

    loginBox.style.boxShadow =
        "0 0 50px #65ff9b";


    setTimeout(() => {

        loginBox.style.display =
            "none";

        document.getElementById("dashboard")
            .style.display = "block";


        // Future EDITH connection goes here.

        startJarvisInterface();

    }, 700);

}


/* ================= JARVIS INTERFACE ================= */

function startJarvisInterface() {

    const status =
        document.getElementById("status");

    status.innerText =
        "ACTIVATED";

    status.classList.remove(
        "listening"
    );

}


/*
   TEMPORARY BROWSER WAKE-WORD DEMO

   This does NOT replace your Python
   EDITH wake-word system yet.

   The real Python connection will be
   added in the next step.
*/

let recognition = null;


if (
    "webkitSpeechRecognition" in window ||
    "SpeechRecognition" in window
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    recognition =
        new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = "en-US";


    recognition.onresult = function(event) {

        const text =
            event.results[
                event.results.length - 1
            ][0].transcript
            .toLowerCase()
            .trim();


        if (
            text.includes("hey jarvis") ||
            text.includes("hey jarvis")
        ) {

            showListening();

        }

    };

}


/* START BROWSER LISTENER */

function startBrowserListener() {

    if (!recognition) {
        return;
    }

    try {
        recognition.start();
    }
    catch(e) {}

}


/* LISTENING DISPLAY */

function showListening() {

    const status =
        document.getElementById("status");

    status.innerText =
        "LISTENING...";

    status.classList.add(
        "listening"
    );


    setTimeout(() => {

        status.innerText =
            "ACTIVATED";

        status.classList.remove(
            "listening"
        );

    }, 3000);

}

</script>

</body>
</html>
