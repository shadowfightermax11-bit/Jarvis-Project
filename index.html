<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#020207;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* ================= LOGIN ================= */

#loginPage{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 50%,rgba(80,0,150,.10),transparent 40%),
        #020207;
}

.login-box{
    width:360px;
    padding:35px;
    border:1px solid #9d00ff;
    border-radius:18px;
    background:rgba(5,5,15,.88);
    box-shadow:
        0 0 25px rgba(157,0,255,.35),
        inset 0 0 25px rgba(157,0,255,.05);
}

.login-box h1{
    text-align:center;
    font-size:34px;
    letter-spacing:6px;
    color:white;
    text-shadow:
        0 0 8px #9d00ff,
        0 0 20px #5c00ff;
}

.subtitle{
    text-align:center;
    margin-top:8px;
    margin-bottom:30px;
    font-size:11px;
    letter-spacing:4px;
    color:#9d7cff;
}

label{
    display:block;
    font-size:10px;
    letter-spacing:2px;
    color:#8e8eaa;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:18px;
    border:1px solid #3b2460;
    border-radius:7px;
    outline:none;
    background:#080810;
    color:white;
    font-size:14px;
}

input:focus{
    border-color:#9d00ff;
    box-shadow:0 0 10px rgba(157,0,255,.25);
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:7px;
    background:linear-gradient(90deg,#7d00ff,#b000ff);
    color:white;
    font-weight:bold;
    letter-spacing:3px;
    cursor:pointer;
    box-shadow:0 0 18px rgba(157,0,255,.4);
}

button:hover{
    box-shadow:0 0 28px rgba(157,0,255,.7);
}

#error{
    text-align:center;
    color:#ff3b6b;
    font-size:11px;
    margin-top:12px;
    display:none;
}

/* ================= DASHBOARD ================= */

#dashboard{
    display:none;
    width:100vw;
    height:100vh;
    position:relative;
    background:
        radial-gradient(circle at center,rgba(30,0,60,.18),transparent 50%),
        #020207;
}

/* stars */

.star{
    position:absolute;
    width:1px;
    height:1px;
    background:white;
    border-radius:50%;
    opacity:.5;
}

/* top bar */

.topbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:70px;
    border-bottom:1px solid rgba(160,80,255,.15);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
    z-index:5;
}

.logo{
    letter-spacing:5px;
    font-weight:bold;
    text-shadow:0 0 10px #9d00ff;
}

.system{
    font-size:10px;
    letter-spacing:3px;
    color:#65ffbd;
    text-shadow:0 0 10px #00ff9d;
}

/* center */

.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:100%;
    height:70%;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= JARVIS WORD ================= */

.jarvis-word{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(42px,7vw,82px);
    font-weight:bold;
    letter-spacing:10px;
    white-space:nowrap;
    color:#ffffff;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #8b5cff,
        0 0 25px #6b00ff,
        0 0 50px #3900ff;

    animation:spaceFloat 4s ease-in-out infinite;
    transition:
        opacity .35s ease,
        transform .35s ease;
}

.jarvis-word.hidden{
    opacity:0;
    transform:translate(-50%,-50%) scale(.75);
    pointer-events:none;
}

@keyframes spaceFloat{
    0%,100%{
        transform:translate(-50%,-50%) translateY(0);
    }

    50%{
        transform:translate(-50%,-50%) translateY(-7px);
    }
}

/* status */

.status{
    position:absolute;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:5px;
    color:#b7a6ff;
    text-shadow:0 0 10px #7c35ff;
}

.hint{
    position:absolute;
    bottom:65px;
    left:50%;
    transform:translateX(-50%);
    font-size:9px;
    letter-spacing:3px;
    color:#55556c;
}

/* bottom */

.bottom{
    position:absolute;
    bottom:18px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 30px;
    font-size:9px;
    letter-spacing:2px;
    color:#4d4d61;
}

/* initialize wires */

#initLines{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
}

.wire{
    position:absolute;
    width:1px;
    height:0;
    background:linear-gradient(
        to bottom,
        #fff,
        #00aaff,
        #9d00ff,
        transparent
    );
    box-shadow:
        0 0 5px #00aaff,
        0 0 12px #9d00ff;
    transform-origin:top center;
    opacity:0;
}

@keyframes wireShoot{
    0%{
        height:0;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        height:100vh;
        opacity:0;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>J.A.R.V.I.S.</h1>

        <div class="subtitle">
            EDITH CORE ACCESS
        </div>

        <label>IDENTIFICATION</label>
        <input id="name" type="text" placeholder="Enter identification">

        <label>ACCESS ID</label>
        <input id="phone" type="text" placeholder="Enter access ID">

        <button onclick="initialize()">

        </button>

        </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard">

    <div id="stars"></div>

    <div class="topbar">

        <div class="logo">
            J.A.R.V.I.S.
        </div>

        <div class="system">
            SYSTEM ONLINE
        </div>

    </div>

    <div class="center">

        <canvas id="canvas"></canvas>

        <div id="jarvisWord" class="jarvis-word">
            J.A.R.V.I.S.
        </div>

    </div>

    <div id="status" class="status">
        ACTIVATED
    </div>

    <div class="hint">
        SAY "HEY JARVIS"
    </div>

    <div class="bottom">

        <span>
            EDITH CORE // CONNECTED
        </span>

        <span>
            AI // READY
        </span>

    </div>

</div>


<div id="initLines"></div>


<script>

/* =========================================================
   LOGIN
========================================================= */

const PASSWORD = "jarvisxedith@07";

function initialize(){

    const password =
        document.getElementById("password").value;

    if(password !== PASSWORD){

        document.getElementById("error").style.display = "block";

        return;
    }

    document.getElementById("error").style.display = "none";

    createStars();

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("dashboard").style.display = "block";

    startCanvas();

    shootLines();

    startMicrophone();

    /* give browser time to display dashboard */
    setTimeout(startWakeRecognition,1000);
}


/* =========================================================
   SPACE STARS
========================================================= */

function createStars(){

    const container =
        document.getElementById("stars");

    container.innerHTML = "";

    for(let i=0;i<180;i++){

        const star =
            document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random()*100 + "%";

        star.style.top =
            Math.random()*100 + "%";

        star.style.opacity =
            0.15 + Math.random()*0.7;

        const size =
            Math.random()*2;

        star.style.width =
            size + "px";

        star.style.height =
            size + "px";

        container.appendChild(star);
    }
}


/* =========================================================
   INITIALIZE WIRES
========================================================= */

function shootLines(){

    const container =
        document.getElementById("initLines");

    container.innerHTML = "";

    const angles = [
        -75,-60,-45,-30,-15,
        15,30,45,60,75
    ];

    angles.forEach((angle,i)=>{

        const wire =
            document.createElement("div");

        wire.className = "wire";

        wire.style.left = "50%";
        wire.style.top = "50%";

        wire.style.transform =
            `rotate(${angle}deg)`;

        wire.style.animation =
            `wireShoot 1.1s ease-out ${i*.04}s forwards`;

        container.appendChild(wire);

    });

    setTimeout(()=>{
        container.innerHTML = "";
    },1600);
}


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

let mode = "standby";

let micLevel = 0;

let analyser = null;

let audioData = null;

let particles = [];

let time = 0;


function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    W = rect.width;
    H = rect.height;

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        W*dpr;

    canvas.height =
        H*dpr;

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   MICROPHONE
========================================================= */

async function startMicrophone(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });

        const audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        const source =
            audioContext.createMediaStreamSource(stream);

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 512;

        analyser.smoothingTimeConstant = .72;

        source.connect(analyser);

        audioData =
            new Uint8Array(
                analyser.frequencyBinCount
            );

    }catch(error){

        console.log(
            "Microphone unavailable:",
            error
        );
    }
}


function updateMic(){

    if(!analyser || !audioData){

        micLevel *= .9;

        return;
    }

    analyser.getByteTimeDomainData(audioData);

    let sum = 0;

    for(let i=0;i<audioData.length;i++){

        const value =
            (audioData[i]-128)/128;

        sum += value*value;
    }

    const rms =
        Math.sqrt(
            sum/audioData.length
        );

    micLevel +=
        (Math.min(1,rms*5)-micLevel)*.25;
}


/* =========================================================
   PARTICLES
========================================================= */

function createThinkingParticles(){

    particles = [];

    for(let i=0;i<330;i++){

        particles.push({

            angle:
                Math.random()*Math.PI*2,

            radius:
                50 + Math.random()*210,

            speed:
                .0008 + Math.random()*.003,

            size:
                .5 + Math.random()*2,

            offset:
                Math.random()*Math.PI*2,

            depth:
                Math.random(),

            color:
                Math.floor(Math.random()*4)

        });
    }
}


/* =========================================================
   MODE
========================================================= */

function setMode(newMode){

    mode = newMode;

    const word =
        document.getElementById("jarvisWord");

    const status =
        document.getElementById("status");

    if(newMode === "standby"){

        word.classList.remove("hidden");

        status.textContent =
            "ACTIVATED";
    }

    else if(newMode === "listening"){

        word.classList.add("hidden");

        status.textContent =
            "LISTENING...";
    }

    else if(newMode === "thinking"){

        word.classList.add("hidden");

        status.textContent =
            "THINKING...";

        createThinkingParticles();
    }

    else if(newMode === "speaking"){

        word.classList.remove("hidden");

        status.textContent =
            "RESPONDING...";
    }
}


/* =========================================================
   DEMO SEQUENCE
========================================================= */

let sequenceRunning = false;

function activateJarvis(){

    if(sequenceRunning)
        return;

    sequenceRunning = true;

    setMode("listening");

    setTimeout(()=>{

        setMode("thinking");

    },4000);

    setTimeout(()=>{

        setMode("speaking");

    },7000);

    setTimeout(()=>{

        setMode("standby");

        sequenceRunning = false;

    },11000);
}


/* =========================================================
   DRAW BLUE ELECTRIC ORB
========================================================= */

function drawElectricBlueOrb(){

    const cx = W/2;
    const cy = H/2;

    /*
       Small orb
       microphone makes it breathe
    */

    const baseR = Math.min(W,H)*.075;

    const R =
        baseR +
        micLevel*Math.min(W,H)*.035;

    /* outer aura */

    const aura =
        ctx.createRadialGradient(
            cx,cy,0,
            cx,cy,R*3.2
        );

    aura.addColorStop(
        0,
        "rgba(0,180,255,.35)"
    );

    aura.addColorStop(
        .3,
        "rgba(0,100,255,.16)"
    );

    aura.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = aura;

    ctx.beginPath();

    ctx.arc(
        cx,cy,R*3.2,0,Math.PI*2
    );

    ctx.fill();


    /* electric blue core */

    const core =
        ctx.createRadialGradient(
            cx-R*.25,
            cy-R*.3,
            R*.05,
            cx,cy,R
        );

    core.addColorStop(
        0,
        "#ffffff"
    );

    core.addColorStop(
        .12,
        "#b9f6ff"
    );

    core.addColorStop(
        .35,
        "#00d9ff"
    );

    core.addColorStop(
        .7,
        "#0077ff"
    );

    core.addColorStop(
        1,
        "rgba(0,35,150,.2)"
    );

    ctx.fillStyle = core;

    ctx.shadowBlur =
        35 + micLevel*35;

    ctx.shadowColor =
        "#00aaff";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        R,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    /* subtle wavy circumference */

    ctx.beginPath();

    const points = 160;

    for(let i=0;i<=points;i++){

        const a =
            i/points*Math.PI*2;

        const wave =
            Math.sin(
                a*8 +
                time*.025
            )*.7 +

            Math.sin(
                a*13 -
                time*.018
            )*.35;

        const rr =
            R*1.08 +
            wave +
            micLevel*4;

        const x =
            cx + Math.cos(a)*rr;

        const y =
            cy + Math.sin(a)*rr;

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);
    }

    ctx.closePath();

    ctx.strokeStyle =
        "rgba(0,190,255,.9)";

    ctx.lineWidth = 1;

    ctx.shadowBlur = 10;

    ctx.shadowColor =
        "#00aaff";

    ctx.stroke();

    ctx.shadowBlur = 0;


    /* inner flowing energy */

    for(let j=0;j<5;j++){

        ctx.beginPath();

        for(let i=0;i<=80;i++){

            const p =
                i/80;

            const a =
                p*Math.PI*2 +
                time*.008*(j+1);

            const rr =
                R*(.45 +
                .25*Math.sin(
                    p*7+j+time*.01
                ));

            const x =
                cx + Math.cos(a)*rr;

            const y =
                cy + Math.sin(a)*rr;

            if(i===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.strokeStyle =
            `rgba(50,190,255,${.12+j*.03})`;

        ctx.lineWidth =
            .5;

        ctx.stroke();
    }


    /* tiny blue particles */

    for(let i=0;i<35;i++){

        const a =
            i*.71 + time*.01;

        const rr =
            R*(1.2 + (i%5)*.22);

        const x =
            cx + Math.cos(a)*rr;

        const y =
            cy + Math.sin(a)*rr;

        const size =
            1 + micLevel*2;

        ctx.fillStyle =
            "rgba(0,200,255,.7)";

        ctx.beginPath();

        ctx.arc(
            x,y,size,0,Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================================================
   THINKING PARTICLES
========================================================= */

function drawThinkingParticles(){

    const cx = W/2;
    const cy = H/2;

    /* faint center */

    const centerGlow =
        ctx.createRadialGradient(
            cx,cy,0,
            cx,cy,100
        );

    centerGlow.addColorStop(
        0,
        "rgba(150,70,255,.35)"
    );

    centerGlow.addColorStop(
        .4,
        "rgba(40,100,255,.15)"
    );

    centerGlow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        centerGlow;

    ctx.beginPath();

    ctx.arc(
        cx,cy,100,0,Math.PI*2
    );

    ctx.fill();


    particles.forEach(p=>{

        p.angle += p.speed;

        const breathing =
            Math.sin(
                time*.006 +
                p.offset
            )*18;

        const r =
            p.radius +
            breathing;

        const x =
            cx +
            Math.cos(p.angle)*r;

        const y =
            cy +
            Math.sin(p.angle)*r*.62;

        let color;

        if(p.color===0)
            color = `rgba(255,45,75,${.4+p.depth*.5})`;

        if(p.color===1)
            color = `rgba(255,220,20,${.4+p.depth*.5})`;

        if(p.color===2)
            color = `rgba(165,60,255,${.4+p.depth*.5})`;

        if(p.color===3)
            color = `rgba(20,150,255,${.4+p.depth*.5})`;

        ctx.fillStyle = color;

        ctx.shadowBlur = 8;

        ctx.shadowColor = color;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    });


    /* occasional energy streaks */

    for(let i=0;i<7;i++){

        const a =
            time*.003 +
            i*.9;

        const r1 =
            100 + i*15;

        const r2 =
            r1 + 30 + Math.sin(time*.01+i)*20;

        const x1 =
            cx + Math.cos(a)*r1;

        const y1 =
            cy + Math.sin(a)*r1*.6;

        const x2 =
            cx + Math.cos(a+.08)*r2;

        const y2 =
            cy + Math.sin(a+.08)*r2*.6;

        ctx.strokeStyle =
            "rgba(100,150,255,.16)";

        ctx.lineWidth = .7;

        ctx.beginPath();

        ctx.moveTo(x1,y1);

        ctx.lineTo(x2,y2);

        ctx.stroke();
    }
}


/* =========================================================
   CANVAS LOOP
========================================================= */

function startCanvas(){

    resizeCanvas();

    requestAnimationFrame(draw);
}


function draw(){

    time++;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    updateMic();

    if(
        mode === "listening"
    ){

        drawElectricBlueOrb();

    }

    else if(
        mode === "thinking"
    ){

        drawThinkingParticles();

    }

    requestAnimationFrame(draw);
}


/* =========================================================
   IMPROVED WAKE WORD RECOGNITION
========================================================= */

let recognition = null;

let recognitionStarted = false;

let recognitionRestartTimer = null;

let lastWakeTime = 0;


/*
   Different browsers can return weird transcripts.

   Examples:
   "hey jarvis"
   "Hey JARVIS"
   "hey, Jarvis"
   "a jarvis"
   "hey jervis"
   "hey jarvis."
*/

function cleanTranscript(text){

    return text
        .toLowerCase()
        .replace(/[.,!?;:]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


function containsWakeWord(text){

    const cleaned =
        cleanTranscript(text);

    /*
       Main exact phrase
    */

    if(
        cleaned.includes("hey jarvis")
    )
        return true;


    /*
       Common speech-recognition variations
    */

    if(
        cleaned.includes("hey jervis")
    )
        return true;


    if(
        cleaned.includes("hey jarvis")
    )
        return true;


    /*
       Sometimes Chrome hears:
       "a jarvis"
       "ay jarvis"
    */

    if(
        cleaned.includes("a jarvis") ||
        cleaned.includes("ay jarvis") ||
        cleaned.includes("hey jarvis")
    )
        return true;


    return false;
}


function handleTranscript(text){

    console.log(
        "Heard:",
        text
    );

    if(
        containsWakeWord(text)
    ){

        const now =
            Date.now();

        /*
           Prevent accidental double activation
        */

        if(
            now-lastWakeTime < 6000
        )
            return;

        lastWakeTime = now;

        console.log(
            "JARVIS WAKE WORD DETECTED"
        );

        activateJarvis();
    }
}


function createRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        console.log(
            "Speech Recognition is not supported by this browser."
        );

        document.getElementById("status")
            .textContent =
            "USE CHROME";
        
        return null;
    }


    const r =
        new SpeechRecognition();


    /*
       Important settings
    */

    r.continuous = true;

    r.interimResults = true;

    r.lang = "en-US";

    /*
       Larger result history
    */

    r.maxAlternatives = 3;


    r.onstart = function(){

        recognitionStarted = true;

        console.log(
            "JARVIS voice recognition ACTIVE"
        );
    };


    r.onresult = function(event){

        for(
            let i=event.resultIndex;
            i<event.results.length;
            i++
        ){

            let result =
                event.results[i];

            /*
               Check interim AND final speech.

               This makes it react faster.
            */

            let text = "";

            for(
                let j=0;
                j<result.length;
                j++
            ){

                text +=
                    " " +
                    result[j].transcript;
            }

            text =
                text.trim();

            if(text){

                handleTranscript(text);
            }
        }
    };


    r.onerror = function(event){

        console.log(
            "Speech recognition error:",
            event.error
        );

        recognitionStarted = false;


        /*
           Don't restart immediately after
           permission errors.
        */

        if(
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ){

            document.getElementById("status")
                .textContent =
                "MIC PERMISSION";

            return;
        }

        scheduleRecognitionRestart();
    };


    r.onend = function(){

        console.log(
            "Recognition stopped."
        );

        recognitionStarted = false;

        /*
           Chrome often stops continuous
           recognition by itself.

           Restart automatically.
        */

        scheduleRecognitionRestart();
    };


    return r;
}


function scheduleRecognitionRestart(){

    if(recognitionRestartTimer)
        return;


    recognitionRestartTimer =
        setTimeout(()=>{

            recognitionRestartTimer = null;

            startWakeRecognition();

        },700);
}


function startWakeRecognition(){

    if(!recognition){

        recognition =
            createRecognition();
    }

    if(!recognition)
        return;


    if(recognitionStarted)
        return;


    try{

        recognition.start();

        console.log(
            "Starting JARVIS recognition..."
        );

    }catch(error){

        console.log(
            "Recognition start:",
            error
        );

        scheduleRecognitionRestart();
    }
}


/* =========================================================
   KEEP RECOGNITION ALIVE
========================================================= */

setInterval(()=>{

    if(
        document.getElementById("dashboard")
            .style.display === "block"
    ){

        if(!recognitionStarted){

            startWakeRecognition();
        }
    }

},3000);


/* =========================================================
   EXTRA KEYBOARD TEST
========================================================= */

/*
   Press J while testing if you want to
   manually trigger the visual sequence.
*/

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key.toLowerCase() === "j"
        ){

            activateJarvis();
        }
    }
);


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    function(){

        console.log(
            "J.A.R.V.I.S. interface loaded."
        );

    }
);

</script>
