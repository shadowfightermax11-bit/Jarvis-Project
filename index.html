<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. // EDITH CORE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020207;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    background:
        radial-gradient(circle at center,
        rgba(80,20,150,.12),
        transparent 35%),
        #020207;
}


/* ================= LOGIN ================= */

#login{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at center,
        rgba(120,30,255,.12),
        transparent 40%),
        #020207;

    z-index:10;
}

.login-box{
    width:360px;
    padding:35px;

    border:1px solid rgba(180,80,255,.5);
    border-radius:18px;

    background:rgba(5,5,15,.8);

    box-shadow:
        0 0 30px rgba(130,30,255,.25),
        inset 0 0 30px rgba(255,230,0,.03);

    text-align:center;
}

.login-title{
    font-size:32px;
    letter-spacing:7px;

    color:#fff;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #9b4dff;

    margin-bottom:8px;
}

.login-sub{
    font-size:11px;
    letter-spacing:4px;
    color:#aaa;
    margin-bottom:28px;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;

    border-radius:8px;
    border:1px solid rgba(150,70,255,.5);

    outline:none;

    background:rgba(255,255,255,.04);
    color:white;

    text-align:center;
}

input:focus{
    border-color:#d3ff00;
    box-shadow:0 0 15px rgba(220,255,0,.2);
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;

    border:none;
    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
    letter-spacing:3px;

    color:#050505;

    background:
        linear-gradient(
            90deg,
            #dfff00,
            #b66cff
        );

    box-shadow:
        0 0 15px rgba(200,255,0,.3),
        0 0 30px rgba(160,70,255,.2);

    position:relative;
    z-index:5;
}

button:hover{
    transform:scale(1.02);
}

#error{
    color:#ff3b5c;
    font-size:12px;
    margin-top:12px;
}


/* ================= INITIALIZE NEON WIRES ================= */

.init-line{
    position:fixed;

    height:1px;
    width:150px;

    left:50%;
    top:50%;

    opacity:0;

    pointer-events:none;
    z-index:20;

    transform-origin:left center;

    background:
        linear-gradient(
            90deg,
            transparent,
            #9b4dff,
            #dfff00,
            #fff,
            transparent
        );

    box-shadow:
        0 0 4px #dfff00,
        0 0 10px #9b4dff;
}

.init-line.active{
    animation:neonWire .75s ease-out forwards;
}

@keyframes neonWire{

    0%{
        opacity:0;
        width:0;
    }

    15%{
        opacity:1;
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
        width:260px;
    }
}


/* ================= DASHBOARD ================= */

#dashboard{
    display:none;
    width:100%;
    height:100%;
    position:relative;
}

.grid{
    position:absolute;
    inset:0;

    opacity:.13;

    background-image:
        linear-gradient(
            rgba(150,80,255,.3)
            1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(150,80,255,.3)
            1px,
            transparent 1px
        );

    background-size:60px 60px;

    transform:
        perspective(500px)
        rotateX(60deg)
        scale(1.6);

    transform-origin:center bottom;
}

.stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.8)
            1px,
            transparent 1px
        );

    background-size:120px 120px;

    opacity:.18;
}


/* ================= TOP ================= */

.top{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    border-bottom:
        1px solid
        rgba(150,80,255,.25);

    background:
        rgba(0,0,5,.35);

    backdrop-filter:blur(10px);

    z-index:3;
}

.logo{
    font-size:22px;
    letter-spacing:7px;

    text-shadow:
        0 0 8px #fff,
        0 0 20px #9d4cff;
}

.online{
    font-size:11px;
    letter-spacing:3px;

    color:#dfff00;

    text-shadow:
        0 0 10px #dfff00;
}


/* ================= CORE CONTAINER ================= */

.core-container{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:min(80vw,700px);
    height:min(80vw,700px);
}

#coreCanvas{
    width:100%;
    height:100%;

    filter:
        drop-shadow(
            0 0 18px
            rgba(150,70,255,.45)
        )
        drop-shadow(
            0 0 35px
            rgba(220,255,0,.18)
        );
}


/* ================= STATUS ================= */

.status{
    position:absolute;

    left:50%;
    bottom:10%;

    transform:
        translateX(-50%);

    text-align:center;

    z-index:4;
}

.status-main{
    font-size:22px;
    letter-spacing:8px;
    font-weight:bold;

    text-shadow:
        0 0 8px #fff,
        0 0 20px #b86cff;
}

.status-sub{
    margin-top:8px;

    font-size:10px;
    letter-spacing:4px;

    color:#aaa;
}


/* ================= BOTTOM ================= */

.bottom{
    position:absolute;

    bottom:0;
    left:0;
    right:0;

    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 30px;

    border-top:
        1px solid
        rgba(150,80,255,.2);

    background:
        rgba(0,0,5,.35);

    font-size:9px;
    letter-spacing:3px;

    color:#777;

    z-index:3;
}

.core-connected{
    color:#c9ff00;
}

.mic-info{
    position:absolute;

    top:85px;
    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;
    letter-spacing:3px;

    color:#777;

    z-index:5;
}


/* =====================================================
   JARVIS WORD
===================================================== */

.jarvis-word{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:
        clamp(42px,8vw,82px);

    font-weight:bold;

    letter-spacing:
        clamp(7px,1.5vw,16px);

    color:#f7f7ff;

    white-space:nowrap;

    text-align:center;

    opacity:1;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #b66cff,
        0 0 28px #773cff,
        0 0 55px rgba(60,100,255,.65);

    animation:
        jarvisFloat 4s ease-in-out infinite;

    transition:
        opacity .5s ease,
        transform .5s ease,
        filter .5s ease;

    z-index:2;
}

@keyframes jarvisFloat{

    0%,100%{
        transform:
            translate(-50%,-50%)
            translateY(0);

        filter:
            brightness(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            translateY(-5px);

        filter:
            brightness(1.18);
    }
}

.jarvis-word.hidden{
    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(.75);

    filter:
        blur(10px);
}


/* =====================================================
   CANVAS
===================================================== */

canvas{
    display:block;
}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

    <div class="login-box">

        <div class="login-title">
            J.A.R.V.I.S.
        </div>

        <div class="login-sub">
            EDITH CORE ACCESS
        </div>

        <input
            id="name"
            type="text"
            placeholder="IDENTIFICATION"
        >

        <input
            id="phone"
            type="text"
            placeholder="ACCESS ID"
        >

        <input
            id="password"
            type="password"
            placeholder="PASSWORD"
        >

        <button onclick="login()">
            INITIALIZE
        </button>

        <div id="error"></div>

    </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard">

    <div class="grid"></div>

    <div class="stars"></div>


    <div class="top">

        <div class="logo">
            J.A.R.V.I.S.
        </div>

        <div class="online">
            ● SYSTEM ONLINE
        </div>

    </div>


    <div
        class="mic-info"
        id="micInfo"
    >
        AUDIO CORE INITIALIZING...
    </div>


    <div class="core-container">

        <!-- JARVIS WORD -->
        <div
            class="jarvis-word"
            id="jarvisWord"
        >
            J.A.R.V.I.S.
        </div>

        <!-- EFFECT CANVAS -->
        <canvas id="coreCanvas"></canvas>

    </div>


    <div class="status">

        <div
            class="status-main"
            id="status"
        >
            ACTIVATED
        </div>

        <div
            class="status-sub"
            id="statusSub"
        >
            SAY "HEY JARVIS"
        </div>

    </div>


    <div class="bottom">

        <div class="core-connected">
            EDITH CORE // CONNECTED
        </div>

        <div>
            AI // READY
        </div>

    </div>

</div>


<script>

/* =====================================================
   LOGIN
===================================================== */

const PASSWORD="jarvisxedith@07";


function login(){

    const password=
        document.getElementById(
            "password"
        ).value;

    const error=
        document.getElementById(
            "error"
        );


    if(password!==PASSWORD){

        error.innerText=
            "ACCESS DENIED // INVALID CREDENTIALS";

        return;

    }


    createNeonWires();


    setTimeout(()=>{

        document.getElementById(
            "login"
        ).style.display="none";


        document.getElementById(
            "dashboard"
        ).style.display="block";


        startCore();

        startMicrophone();

        startJarvisRecognition();

    },650);

}


/* =====================================================
   INITIALIZE WIRES
===================================================== */

function createNeonWires(){

    for(let i=0;i<9;i++){

        const line=
            document.createElement("div");


        line.className=
            "init-line";


        const angle=
            (360/9)*i;


        line.style.transform=
            `rotate(${angle}deg)`;


        document.body.appendChild(
            line
        );


        setTimeout(()=>{

            line.classList.add(
                "active"
            );

        },i*25);


        setTimeout(()=>{

            line.remove();

        },1000);

    }

}


/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById(
        "coreCanvas"
    );

const ctx=
    canvas.getContext("2d");


let W,H;


function resize(){

    const rect=
        canvas.getBoundingClientRect();


    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );


    canvas.width=
        rect.width*dpr;


    canvas.height=
        rect.height*dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    W=rect.width;
    H=rect.height;

}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   STATE
===================================================== */

let mode="standby";

let rotation=0;

let micLevel=0;

let speakingLevel=0;

let busy=false;


/* =====================================================
   PARTICLES
===================================================== */

const particles=[];


for(let i=0;i<330;i++){

    particles.push({

        angle:
            Math.random()*
            Math.PI*2,

        radius:
            65+
            Math.random()*185,

        speed:
            .001+
            Math.random()*.004,

        size:
            .4+
            Math.random()*1.8,

        phase:
            Math.random()*
            Math.PI*2,

        depth:
            Math.random(),

        color:
            i%17===0
            ?"red"
            :
            i%4===0
            ?"yellow"
            :
            i%3===0
            ?"purple"
            :
            "blue"

    });

}


/* =====================================================
   DRAW
===================================================== */

function drawOrb(){

    const cx=W/2;
    const cy=H/2;


    /* =================================================
       STANDBY
       JARVIS WORD IS VISIBLE
    ================================================= */

    if(mode==="standby" ||
       mode==="speaking"){

        return;

    }


    /* =================================================
       LISTENING
       ELECTRIC BLUE ORB
    ================================================= */

    if(mode==="listening"){

        drawElectricBlueOrb(
            cx,
            cy
        );

        return;

    }


    /* =================================================
       THINKING
       COLOR PARTICLE ENERGY
    ================================================= */

    if(mode==="thinking"){

        drawThinkingParticles(
            cx,
            cy
        );

        return;

    }

}


/* =====================================================
   ELECTRIC BLUE ORB
===================================================== */

function drawElectricBlueOrb(cx,cy){

    const reaction=
        micLevel;


    const R=
        Math.min(W,H)*
        .105*
        (
            1+
            reaction*.35
        );


    /* -----------------------------------------
       HUGE BLUE AURA
    ----------------------------------------- */

    for(let i=10;i>0;i--){

        const radius=
            R+
            i*11+
            reaction*25;


        const glow=
            ctx.createRadialGradient(
                cx,
                cy,
                0,
                cx,
                cy,
                radius
            );


        glow.addColorStop(
            0,
            `rgba(
                0,
                235,
                255,
                ${.025*i}
            )`
        );


        glow.addColorStop(
            .35,
            `rgba(
                0,
                120,
                255,
                ${.018*i}
            )`
        );


        glow.addColorStop(
            .65,
            `rgba(
                40,
                60,
                255,
                ${.012*i}
            )`
        );


        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI*2
        );

        ctx.fillStyle=glow;

        ctx.fill();

    }


    /* -----------------------------------------
       BLUE CORE
    ----------------------------------------- */

    const core=
        ctx.createRadialGradient(
            cx-R*.2,
            cy-R*.25,
            0,
            cx,
            cy,
            R*1.15
        );


    core.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    core.addColorStop(
        .08,
        "rgba(170,250,255,1)"
    );

    core.addColorStop(
        .20,
        "rgba(0,240,255,1)"
    );

    core.addColorStop(
        .40,
        "rgba(0,190,255,.98)"
    );

    core.addColorStop(
        .62,
        "rgba(0,100,255,.75)"
    );

    core.addColorStop(
        .82,
        "rgba(20,40,220,.30)"
    );

    core.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        R,
        0,
        Math.PI*2
    );

    ctx.fillStyle=core;

    ctx.shadowBlur=
        45+
        reaction*35;

    ctx.shadowColor=
        "#00dfff";

    ctx.fill();

    ctx.shadowBlur=0;


    /* -----------------------------------------
       SUBTLE WAVING CIRCUMFERENCE
    ----------------------------------------- */

    const points=220;


    ctx.beginPath();


    for(let i=0;i<=points;i++){

        const a=
            i/points*
            Math.PI*2;


        const wave=

            Math.sin(
                a*5+
                performance.now()*.0013
            )*1.4

            +

            Math.sin(
                a*9-
                performance.now()*.0008
            )*.6;


        const r=
            R+
            wave+
            micLevel*5;


        const x=
            cx+
            Math.cos(a)*r;


        const y=
            cy+
            Math.sin(a)*r;


        if(i===0){

            ctx.moveTo(x,y);

        }else{

            ctx.lineTo(x,y);

        }

    }


    ctx.closePath();


    const edge=
        ctx.createLinearGradient(
            cx-R,
            cy-R,
            cx+R,
            cy+R
        );


    edge.addColorStop(
        0,
        "#00eaff"
    );

    edge.addColorStop(
        .35,
        "#008cff"
    );

    edge.addColorStop(
        .65,
        "#00dfff"
    );

    edge.addColorStop(
        1,
        "#7b5cff"
    );


    ctx.strokeStyle=edge;

    ctx.lineWidth=1.8;

    ctx.shadowBlur=16;

    ctx.shadowColor=
        "#00cfff";

    ctx.stroke();

    ctx.shadowBlur=0;


    /* -----------------------------------------
       INNER BLUE ENERGY
    ----------------------------------------- */

    for(let i=0;i<12;i++){

        ctx.beginPath();


        const yOffset=
            (i-6)*R*.12;


        for(let j=0;j<=60;j++){

            const p=j/60;


            const x=
                cx-
                R*.75+
                p*R*1.5;


            const y=
                cy+
                yOffset+
                Math.sin(
                    p*7+
                    rotation*3+
                    i
                )*
                (1.5+micLevel*7);


            if(j===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);

        }


        ctx.strokeStyle=
            `rgba(
                140,
                240,
                255,
                ${.05+i*.008}
            )`;


        ctx.lineWidth=.7;

        ctx.stroke();

    }


    /* -----------------------------------------
       LISTENING PARTICLES
    ----------------------------------------- */

    for(let i=0;i<65;i++){

        const p=
            particles[i];


        p.angle+=
            p.speed*3;


        const distance=
            R+
            15+
            ((i*17)%55)+
            micLevel*45;


        const x=
            cx+
            Math.cos(p.angle)*
            distance;


        const y=
            cy+
            Math.sin(p.angle)*
            distance*.7;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI*2
        );


        ctx.fillStyle=
            "rgba(0,220,255,.8)";


        ctx.fill();

    }

}


/* =====================================================
   THINKING PARTICLE CLOUD
===================================================== */

function drawThinkingParticles(cx,cy){

    const time=
        performance.now()*.001;


    const centerGlow=
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            170
        );


    centerGlow.addColorStop(
        0,
        "rgba(255,80,80,.20)"
    );

    centerGlow.addColorStop(
        .25,
        "rgba(150,40,255,.16)"
    );

    centerGlow.addColorStop(
        .55,
        "rgba(20,100,255,.10)"
    );

    centerGlow.addColorStop(
        .75,
        "rgba(255,230,0,.06)"
    );

    centerGlow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        175,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        centerGlow;

    ctx.fill();


    /* -----------------------------------------
       FLOATING PARTICLES
    ----------------------------------------- */

    particles.forEach((p,i)=>{

        p.angle+=
            p.speed*7;


        let radius=
            p.radius+
            Math.sin(
                time*1.5+
                p.phase
            )*15;


        radius+=
            Math.sin(
                time*2+
                i
            )*8;


        const x=
            cx+
            Math.cos(
                p.angle
            )*
            radius;


        const y=
            cy+
            Math.sin(
                p.angle
            )*
            radius*.68;


        let alpha=
            .45+
            Math.sin(
                time*3+
                p.phase
            )*.25;


        let color;


        if(p.color==="red"){

            color=
                `rgba(255,40,65,${alpha})`;

        }

        else if(p.color==="yellow"){

            color=
                `rgba(255,235,0,${alpha})`;

        }

        else if(p.color==="purple"){

            color=
                `rgba(175,70,255,${alpha})`;

        }

        else{

            color=
                `rgba(0,190,255,${alpha})`;

        }


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size+
            Math.random()*.7,
            0,
            Math.PI*2
        );


        ctx.fillStyle=color;

        ctx.shadowBlur=8;

        ctx.shadowColor=color;

        ctx.fill();

    });


    ctx.shadowBlur=0;


    /* -----------------------------------------
       OCCASIONAL ENERGY STREAKS
    ----------------------------------------- */

    for(let i=0;i<16;i++){

        const a=
            i*.39+
            rotation;


        const inner=35;

        const outer=
            90+
            Math.sin(
                time*2+i
            )*40;


        const x1=
            cx+
            Math.cos(a)*
            inner;


        const y1=
            cy+
            Math.sin(a)*
            inner;


        const x2=
            cx+
            Math.cos(a+.5)*
            outer;


        const y2=
            cy+
            Math.sin(a+.5)*
            outer;


        const gradient=
            ctx.createLinearGradient(
                x1,y1,x2,y2
            );


        gradient.addColorStop(
            0,
            "rgba(255,255,255,.45)"
        );


        gradient.addColorStop(
            .3,
            "rgba(255,230,0,.35)"
        );


        gradient.addColorStop(
            .55,
            "rgba(150,60,255,.35)"
        );


        gradient.addColorStop(
            .8,
            "rgba(0,170,255,.3)"
        );


        gradient.addColorStop(
            1,
            "rgba(255,30,60,0)"
        );


        ctx.beginPath();

        ctx.moveTo(x1,y1);

        ctx.quadraticCurveTo(
            cx+
            Math.cos(a+.25)*
            outer,
            cy+
            Math.sin(a+.25)*
            outer*.7,
            x2,
            y2
        );


        ctx.strokeStyle=
            gradient;

        ctx.lineWidth=1;

        ctx.stroke();

    }

}


/* =====================================================
   CORE LOOP
===================================================== */

function animate(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    if(mode==="thinking"){

        rotation+=.018;

    }else{

        rotation+=.006;

    }


    drawOrb();


    requestAnimationFrame(
        animate
    );

}


/* =====================================================
   START CORE
===================================================== */

function startCore(){

    resize();

    animate();

}


/* =====================================================
   MICROPHONE
===================================================== */

let audioContext=null;

let analyser=null;

let microphone=null;

let audioData=null;


async function startMicrophone(){

    try{

        const stream=
            await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });


        const AudioContext=
            window.AudioContext||
            window.webkitAudioContext;


        audioContext=
            new AudioContext();


        analyser=
            audioContext.createAnalyser();


        analyser.fftSize=256;


        microphone=
            audioContext
            .createMediaStreamSource(
                stream
            );


        microphone.connect(
            analyser
        );


        audioData=
            new Uint8Array(
                analyser.frequencyBinCount
            );


        document.getElementById(
            "micInfo"
        ).innerText=
            "AUDIO CORE // ONLINE";


        updateMic();

    }

    catch(error){

        document.getElementById(
            "micInfo"
        ).innerText=
            "MICROPHONE ACCESS REQUIRED";


        console.log(error);

    }

}


/* =====================================================
   MIC LEVEL
===================================================== */

function updateMic(){

    if(analyser){

        analyser.getByteFrequencyData(
            audioData
        );


        let total=0;


        for(
            let i=0;
            i<audioData.length;
            i++
        ){

            total+=
                audioData[i];

        }


        const target=
            total/
            audioData.length/
            255;


        micLevel=
            micLevel*.78+
            target*.22;

    }


    requestAnimationFrame(
        updateMic
    );

}


/* =====================================================
   STATES
===================================================== */

function setMode(newMode){

    mode=newMode;


    const word=
        document.getElementById(
            "jarvisWord"
        );


    const status=
        document.getElementById(
            "status"
        );


    const sub=
        document.getElementById(
            "statusSub"
        );


    /* -----------------------------------------
       STANDBY
    ----------------------------------------- */

    if(newMode==="standby"){

        word.classList.remove(
            "hidden"
        );


        status.innerText=
            "ACTIVATED";


        sub.innerText=
            'SAY "HEY JARVIS"';

    }


    /* -----------------------------------------
       LISTENING
    ----------------------------------------- */

    if(newMode==="listening"){

        word.classList.add(
            "hidden"
        );


        status.innerText=
            "LISTENING...";


        sub.innerText=
            "AUDIO INPUT DETECTED";

    }


    /* -----------------------------------------
       THINKING
    ----------------------------------------- */

    if(newMode==="thinking"){

        word.classList.add(
            "hidden"
        );


        status.innerText=
            "THINKING...";


        sub.innerText=
            "EDITH CORE PROCESSING";

    }


    /* -----------------------------------------
       SPEAKING
    ----------------------------------------- */

    if(newMode==="speaking"){

        /*
           JARVIS WORD RETURNS
           DURING RESPONSE
        */

        word.classList.remove(
            "hidden"
        );


        status.innerText=
            "RESPONDING...";


        sub.innerText=
            "J.A.R.V.I.S. RESPONSE";

    }

}


/* =====================================================
   WAKE WORD
===================================================== */

let recognition=null;


function startJarvisRecognition(){

    const SpeechRecognition=
        window.SpeechRecognition||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        console.log(
            "Speech recognition unavailable."
        );

        return;

    }


    recognition=
        new SpeechRecognition();


    recognition.continuous=true;

    recognition.interimResults=true;

    recognition.lang="en-US";


    recognition.onresult=
        function(event){

            let transcript="";


            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                transcript+=
                    event.results[i][0]
                    .transcript
                    .toLowerCase();

            }


            if(
                transcript.includes(
                    "hey jarvis"
                )
            ){

                activateJarvis();

            }

        };


    recognition.onend=
        function(){

            try{

                recognition.start();

            }

            catch(e){}

        };


    try{

        recognition.start();

    }

    catch(e){}

}


/* =====================================================
   JARVIS SEQUENCE
===================================================== */

function activateJarvis(){

    if(busy)
        return;


    busy=true;


    /* 
       WORD → BLUE ORB
    */

    setMode(
        "listening"
    );


    /*
       LISTENING → THINKING
    */

    setTimeout(()=>{

        setMode(
            "thinking"
        );

    },4000);


    /*
       THINKING → RESPONSE
       JARVIS WORD RETURNS
    */

    setTimeout(()=>{

        setMode(
            "speaking"
        );


        fakeSpeaking();

    },7000);


    /*
       BACK TO STANDBY
    */

    setTimeout(()=>{

        setMode(
            "standby"
        );


        speakingLevel=0;

        busy=false;

    },11000);

}


/* =====================================================
   SPEAKING ANIMATION
===================================================== */

function fakeSpeaking(){

    const start=
        performance.now();


    function animateVoice(){

        if(mode!=="speaking"){

            speakingLevel=0;

            return;

        }


        const elapsed=
            (
                performance.now()-
                start
            )/1000;


        speakingLevel=
            .25+
            Math.abs(
                Math.sin(
                    elapsed*7
                )
            )*.6+
            Math.random()*.12;


        requestAnimationFrame(
            animateVoice
        );

    }


    animateVoice();

}
